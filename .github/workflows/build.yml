name: Build and test

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run test suite
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\tools\build-tests.ps1

      - name: Build distributable installer
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\tools\build-installer.ps1 -SemMotor

      - name: Validate package and checksum
        shell: powershell
        run: |
          $setup = (Resolve-Path .\dist\MhiagosControlSetup.exe).Path
          $assembly = [Reflection.Assembly]::LoadFile($setup)
          $names = $assembly.GetManifestResourceNames()
          @('payload.MhiagosControl.exe', 'payload.LibreHardwareMonitorLib.dll', 'payload.lhm-license.txt') | ForEach-Object {
            if ($names -notcontains $_) { throw "recurso obrigatorio ausente: $_" }
          }
          # Assertiva NEGATIVA, e nao so a lista do que precisa estar presente:
          # um instalador compilado sem -SemMotor carrega um quarto recurso com a
          # biblioteca comercial da REALiX e passaria pela checagem acima, porque
          # os tres obrigatorios continuam la. Publicar esse pacote nao e opcao.
          if ($names -contains 'payload.engine.dll') {
            throw "pacote contem a biblioteca comercial do HWiNFO (payload.engine.dll) e NAO pode ser distribuido"
          }
          (Get-FileHash $setup -Algorithm SHA256).Hash + '  MhiagosControlSetup.exe' |
            Set-Content .\dist\MhiagosControlSetup.exe.sha256 -Encoding ascii

      - name: Upload distributable package
        uses: actions/upload-artifact@v4
        with:
          name: MhiagosControl
          path: |
            dist/MhiagosControlSetup.exe
            dist/MhiagosControlSetup.exe.sha256
          if-no-files-found: error
          retention-days: 7
