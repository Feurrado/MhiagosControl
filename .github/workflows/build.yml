name: Build and test

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Actions fixadas por commit (o comentario diz a versao): uma tag trocada nao entra no build.
permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Run test suite
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\tools\build-tests.ps1

      - name: Build distributable installer
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\tools\build-installer.ps1 -SemMotor

      - name: Validate package and checksum
        shell: powershell
        run: |
          $setup = (Resolve-Path .\dist\MhiagosControlSetup.exe).Path
          $assembly = [Reflection.Assembly]::LoadFile($setup)
          $names = $assembly.GetManifestResourceNames()
          @('payload.MhiagosControl.exe', 'payload.LibreHardwareMonitorLib.dll', 'payload.lhm-license.txt',
            'payload.notices.txt', 'payload.lib.HidSharp.dll', 'payload.lib.System.Memory.dll') | ForEach-Object {
            if ($names -notcontains $_) { throw "recurso obrigatorio ausente: $_" }
          }
          # Assertiva NEGATIVA, e nao so a lista do que precisa estar presente:
          # um instalador compilado sem -SemMotor carrega um quarto recurso com a
          # biblioteca comercial da REALiX e passaria pela checagem acima, porque
          # os tres obrigatorios continuam la. Publicar esse pacote nao e opcao.
          if ($names -contains 'payload.engine.dll') {
            throw "pacote contem a biblioteca comercial do HWiNFO (payload.engine.dll) e NAO pode ser distribuido"
          }
          (Get-FileHash $setup -Algorithm SHA256).Hash + '  MhiagosControlSetup.exe' |
            Set-Content .\dist\MhiagosControlSetup.exe.sha256 -Encoding ascii

      - name: Upload distributable package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: MhiagosControl
          path: |
            dist/MhiagosControlSetup.exe
            dist/MhiagosControlSetup.exe.sha256
          if-no-files-found: error
          retention-days: 7

  servidor:
    # Servidor da Casa (Python): os testes rodam com a ConnectLife simulada.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: servidor

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install dependencies (hash-checked lock)
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock

      - name: Run server tests
        run: python -m unittest discover -s tests -v

      - name: Build container image
        run: docker build -t mhiagos-casa:ci .

      - name: Validate compose file
        run: |
          echo "MHIAGOS_CHAVE=ci-0123456789abcdef" > .env
          docker compose config -q
