<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mhiagos Control</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <nav id="nav" aria-label="Páginas">
    <div class="topo">
      <img class="logo" src="app.ico" alt="">
      <span class="nome-app">Mhiagos Control</span>
      <button id="recolher" class="hamb icone" type="button" aria-label="Recolher a barra">&#xE700;</button>
    </div>
    <div class="perfil"><small id="perfil-rotulo">PERFIL ATIVO</small><span id="perfil-ativo"></span></div>
    <div id="itens" role="tablist"></div>
  </nav>
  <main id="main" tabindex="-1">
    <div id="faixa" class="faixa" role="status" hidden><span class="msg" id="faixa-msg"></span><span id="faixa-acao"></span><button id="faixa-fechar" class="fechar icone" type="button" aria-label="Fechar">&#xE711;</button></div>
    <section id="pagina"></section>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
